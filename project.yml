name: Switchboard
options:
  bundleIdPrefix: com.stalloevan
  deploymentTarget:
    iOS: "18.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Switchboard:
    type: application
    platform: iOS
    sources:
      - path: Switchboard
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Switchboard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Switchboard uses Bluetooth to pair new Matter bulbs.
        NSLocalNetworkUsageDescription: Switchboard talks to your Matter bulbs over your home Wi-Fi network.
        NSBonjourServices:
          - _matter._tcp
          - _matterc._udp
          - _matterd._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stalloevan.switchboard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
