name: Build IPA

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          set +e
          xcodebuild \
            -project Switchboard.xcodeproj \
            -scheme Switchboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            grep -E "error:" build.log | sort -u | head -30 | while IFS= read -r line; do
              echo "::error::${line//$'\r'/}"
            done
            tail -n 30 build.log | while IFS= read -r line; do echo "::warning::${line}"; done
            exit $status
          fi

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Switchboard.app Payload/
          zip -r "Switchboard-v${{ steps.ver.outputs.version }}.ipa" Payload

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "Switchboard-v${{ steps.ver.outputs.version }}.ipa" \
            --title "Switchboard v${{ steps.ver.outputs.version }}" \
            --target "${{ github.sha }}"
